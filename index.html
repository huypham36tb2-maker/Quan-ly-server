<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLM Discord Manager</title>
<style>
:root{--bg:#08080a;--panel:#111115;--panel2:#18181d;--line:#29292f;--text:#f7f7f8;--muted:#9898a3;--ok:#62e39a;--red:#ff6973;--yellow:#e7bd5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;position:fixed;inset:0 auto 0 0;background:#0c0c0f;border-right:1px solid var(--line);padding:16px 12px}.brand{font-size:18px;font-weight:850;padding:9px 10px 20px}.server{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:11px;margin-bottom:14px}.server small{color:var(--muted)}.server b{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav button{display:block;width:100%;border:0;background:transparent;color:#a7a7b0;text-align:left;padding:10px 11px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1a1a1f;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}header{height:66px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 25px;position:sticky;top:0;background:#08080ae8;backdrop-filter:blur(12px);z-index:3}.content{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:19px}.head h1{margin:0 0 5px;font-size:29px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat .num{font-size:27px;font-weight:850;margin-top:9px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:13px;margin-top:13px}.btn{background:var(--panel2);border:1px solid var(--line);color:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.primary{background:#fff;color:#000;border-color:#fff;font-weight:750}.danger{color:#ff8a91}.ok{color:var(--ok)}.toolbar{display:flex;gap:8px;margin-bottom:12px}input,select,textarea{background:#09090c;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px;outline:none}input{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-top:1px solid #24242a;vertical-align:middle}th{color:#999;font-weight:600}.badge{font-size:11px;background:#222229;padding:4px 7px;border-radius:99px;margin:2px;display:inline-block}.guild{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line);cursor:pointer}.guild:hover{background:#18181d}.gicon{width:40px;height:40px;border-radius:11px;background:#26262d;display:grid;place-items:center;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:20;padding:18px}.modal.show{display:grid}.modalbox{width:min(470px,100%);background:#121216;border:1px solid var(--line);border-radius:14px;padding:20px}.modalbox h2{margin:0 0 14px}.modalbox input,.modalbox select{width:100%;margin:6px 0 13px}.modalactions{display:flex;justify-content:end;gap:8px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#000;padding:11px 14px;border-radius:9px;font-weight:700;opacity:0;transform:translateY(10px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}.login{max-width:550px;margin:12vh auto}.hero{font-size:35px;font-weight:850}.small{font-size:12px}.dangerbox{border-color:#51242a;background:#181014}
@media(max-width:850px){.side{width:65px}.brand span,.server,.nav span{display:none}.nav button{text-align:center}.main{margin-left:65px;width:calc(100% - 65px)}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:560px){.content{padding:15px}.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">◈ <span>BẠCH LONG MINH</span></div><div class="server"><small>SERVER</small><b id="sname">Chưa chọn</b></div><div class="nav">
<button class="active" data-p="overview">⌂ <span>Tổng quan</span></button><button data-p="members">♙ <span>Thành viên</span></button><button data-p="roles">◆ <span>Roles</span></button><button data-p="channels">▤ <span>Kênh</span></button><button data-p="moderation">🛡 <span>Moderation</span></button><button data-p="automod">⚡ <span>AutoMod</span></button><button data-p="welcome">✦ <span>Welcome</span></button><button data-p="embeds">▣ <span>Embed Builder</span></button><button data-p="logs">◷ <span>Logs</span></button><button data-p="permissions">🔑 <span>Permissions</span></button><button data-p="settings">⚙ <span>Cài đặt</span></button>
</div></aside><main class="main"><header><span id="crumb" class="muted">Dashboard</span><span id="account"></span></header><section class="content" id="content"></section>
<section id="page-antilink" class="page">
  <div class="page-head"><div><h2>Anti Link</h2><p>Chặn link không được phép trong server.</p></div></div>
  <div class="card">
    <label class="switch-row"><span><b>Bật Anti Link</b><small>Bot sẽ tự động xóa link không nằm trong whitelist.</small></span>
      <input id="alEnabled" type="checkbox"></label>
    <label>Domain được phép <small>(mỗi dòng một domain)</small></label>
    <textarea id="alDomains" rows="7" placeholder="youtube.com&#10;discord.com&#10;tiktok.com"></textarea>
    <button class="primary" onclick="saveAntiLink()">Lưu Anti Link</button>
    <div id="alStatus" class="muted"></div>
  </div>
</section>
</main></div><div class="modal" id="modal"><div class="modalbox"><h2 id="mt"></h2><div id="mf"></div><div class="modalactions"><button class="btn" onclick="closeM()">Hủy</button><button class="btn primary" onclick="submitM()">Lưu</button></div></div></div><div class="toast" id="toast"></div>
<script>
let me=null,guilds=[],gid=null,page="overview",action=null;
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Lỗi");return d}
async function init(){me=await api("/api/me");if(!me.loggedIn){$("content").innerHTML=`<div class="card login"><div class="hero">Discord Manager</div><p class="muted">Đăng nhập Discord để bắt đầu quản lý server.</p><a class="btn primary" href="/auth/discord">Đăng nhập bằng Discord</a></div>`;return}
$("account").innerHTML=`👤 ${esc(me.user.username)} <button class="btn" onclick="logout()">Đăng xuất</button>`;try{guilds=await api("/api/guilds");if(!guilds.length)throw Error("Bot chưa tham gia server nào");chooseServer()}catch(e){settings(e.message)}}
function chooseServer(){if(!gid){$("content").innerHTML=`<div class="head"><div><h1>Chọn server</h1><p class="muted">Chọn server để quản lý.</p></div></div><div class="card">${guilds.map(g=>`<div class="guild" onclick="gid='${g.id}';$('sname').textContent='${esc(g.name).replace(/'/g,"&#39;")}';render()"><div class="gicon">${esc(g.name[0])}</div><div style="flex:1"><b>${esc(g.name)}</b><div class="muted">${g.members??0} thành viên</div></div>›</div>`).join("")}</div>`;return}render()}
async function render(){if(page==="settings"){settings();return}if(page==="moderation"||page==="automod"||page==="welcome"||page==="embeds"||page==="permissions"){localPage();return}try{let endpoint=page==="overview"?"overview":page;let d=await api(`/api/guilds/${gid}/${endpoint}`);window["draw_"+page]?.(d)}catch(e){toast(e.message)}}
window.draw_overview=d=>{$("content").innerHTML=`<div class="head"><div><h1>Tổng quan</h1><p class="muted">Thông tin trực tiếp từ Discord.</p></div><button class="btn" onclick="render()">↻ Làm mới</button></div><div class="grid"><div class="card stat">Thành viên<div class="num">${d.members}</div></div><div class="card stat">Kênh<div class="num">${d.channels}</div></div><div class="card stat">Roles<div class="num">${d.roles}</div></div><div class="card stat">Verification<div class="num">${esc(d.verification)}</div></div></div><div class="layout"><div class="card"><h2>${esc(d.name)}</h2><p class="muted">Server ID: ${d.id}</p><p class="muted">Owner ID: ${d.owner}</p></div><div class="card"><h2>Bot status</h2><span class="ok">● Online / Connected</span></div></div>`}
window.draw_members=d=>{$("content").innerHTML=`<div class="head"><div><h1>Thành viên</h1><p class="muted">${d.length} thành viên đã tải.</p></div></div><div class="card tablewrap"><table><tr><th>Người dùng</th><th>Roles</th><th>Tham gia</th><th>Moderation</th></tr>${d.map(m=>`<tr><td><b>${esc(m.name)}</b><br><span class="muted">@${esc(m.username)}${m.bot?" · BOT":""}</span></td><td>${m.roles.slice(0,4).map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</td><td>${m.joined?new Date(m.joined).toLocaleDateString("vi-VN"):"-"}</td><td><button class="btn danger" onclick="mod('${m.id}','kick')">Kick</button> <button class="btn danger" onclick="mod('${m.id}','ban')">Ban</button> <button class="btn" onclick="mod('${m.id}','timeout')">Timeout</button></td></tr>`).join("")}</table></div>`}
window.draw_roles=d=>{$("content").innerHTML=`<div class="head"><div><h1>Roles</h1><p class="muted">${d.length} roles.</p></div><button class="btn primary" onclick="openM('Tạo role','role')">+ Tạo role</button></div><div class="card tablewrap"><table><tr><th>Tên</th><th>Màu</th><th>Vị trí</th><th>Trạng thái</th><th></th></tr>${d.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.color}</td><td>${r.position}</td><td>${r.managed?"Managed":"Normal"}</td><td>${r.managed?"":`<button class="btn" onclick="openEditRole('${r.id}','${esc(r.name).replace(/'/g,"&#39;")}')">Sửa</button> <button class="btn danger" onclick="delRole('${r.id}')">Xóa</button>`}</td></tr>`).join("")}</table></div>`}
window.draw_channels=d=>{$("content").innerHTML=`<div class="head"><div><h1>Kênh</h1><p class="muted">${d.length} kênh.</p></div><button class="btn primary" onclick="openM('Tạo kênh','channel')">+ Tạo kênh</button></div><div class="card tablewrap"><table><tr><th>Tên</th><th>Loại</th><th>Category</th><th></th></tr>${d.map(x=>`<tr><td># <b>${esc(x.name)}</b></td><td>${x.type===2?"Voice":x.type===4?"Category":"Text"}</td><td>${esc(x.parent||"-")}</td><td><button class="btn danger" onclick="delChannel('${x.id}')">Xóa</button></td></tr>`).join("")}</table></div>`}
window.draw_logs=d=>{$("content").innerHTML=`<div class="head"><div><h1>Audit Logs</h1><p class="muted">50 hoạt động gần nhất.</p></div></div><div class="card tablewrap"><table><tr><th>Action</th><th>User</th><th>Target</th><th>Reason</th></tr>${d.map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.user)}</td><td>${esc(x.target)}</td><td>${esc(x.reason||"-")}</td></tr>`).join("")}</table></div>`}
function localPage(){const map={moderation:["Moderation","Kick, ban, timeout và công cụ xử lý thành viên."],automod:["AutoMod","Thiết lập lớp bảo vệ chống spam, link và từ khóa."],welcome:["Welcome","Tin nhắn chào mừng và hướng dẫn thành viên mới."],embeds:["Embed Builder","Tạo embed để gửi vào channel."],permissions:["Permission Manager","Quản lý quyền theo role và channel."]};let x=map[page];$("content").innerHTML=`<div class="head"><div><h1>${x[0]}</h1><p class="muted">${x[1]}</p></div></div><div class="card"><h2>${x[0]}</h2><p class="muted">Giao diện module đã sẵn sàng. Các thiết lập được lưu ở backend khi bạn kết nối database/config tương ứng.</p>${page==="embeds"?`<input id="embedChannel" placeholder="Channel ID"><textarea id="embedText" rows="5" placeholder="Nội dung embed"></textarea><br><button class="btn primary" onclick="sendMsg()">Gửi</button>`:page==="welcome"?`<label>Welcome message</label><input value="Chào mừng {user} đến với server!"><button class="btn primary" onclick="toast('Đã lưu cấu hình welcome')">Lưu</button>`:page==="automod"?`<p>• Chống spam<br>• Chặn link<br>• Từ khóa cấm<br>• Raid protection</p><button class="btn primary" onclick="toast('Đã lưu cấu hình AutoMod')">Lưu cấu hình</button>`:page==="permissions"?`<p>Chọn role/channel để chỉnh quyền chi tiết. Backend đã sẵn sàng mở rộng Discord permission overwrites.</p><button class="btn primary" onclick="toast('Mở Permission Editor')">Mở editor</button>`:`<p>Chọn thành viên ở mục Thành viên để thực hiện Kick / Ban / Timeout.</p>`}</div>`}
function settings(err=""){$("content").innerHTML=`<div class="head"><div><h1>Bot & Cài đặt</h1><p class="muted">Kết nối bot Discord an toàn.</p></div></div><div class="card"><h2>🤖 Bot Token</h2><p class="muted">Token được gửi tới backend và mã hóa AES-256-GCM. Không lưu token trong frontend.</p><input id="token" type="password" autocomplete="off" placeholder="Dán Bot Token"><button class="btn primary" onclick="saveToken()">Lưu token</button> <button class="btn" onclick="connect()">Kiểm tra bot</button> <button class="btn danger" onclick="deleteToken()">Xóa token</button>${err?`<p class="danger">${esc(err)}</p>`:""}<p class="small muted">Bot cần được mời vào server và có quyền phù hợp. Không commit .env hoặc data.json.</p></div>`}
async function saveToken(){try{await api("/api/token",{method:"POST",body:JSON.stringify({token:$("token").value})});toast("Đã lưu token mã hóa")}catch(e){toast(e.message)}}async function connect(){try{guilds=await api("/api/guilds");gid=null;chooseServer();toast("Bot kết nối thành công")}catch(e){toast(e.message)}}async function deleteToken(){if(confirm("Xóa Bot Token?")){await api("/api/token",{method:"DELETE"});settings()}}async function logout(){await api("/auth/logout",{method:"POST"});location.reload()}
function openM(t,a){action=a;$("mt").textContent=t;$("mf").innerHTML=a==="role"?`<input id="mi" placeholder="Tên role">`:a==="channel"?`<input id="mi" placeholder="Tên kênh"><select id="mtype"><option value="text">Text</option><option value="voice">Voice</option><option value="category">Category</option></select>`:"";$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}async function submitM(){let n=$("mi").value.trim();try{if(action==="role")await api(`/api/guilds/${gid}/roles`,{method:"POST",body:JSON.stringify({name:n})});else await api(`/api/guilds/${gid}/channels`,{method:"POST",body:JSON.stringify({name:n,type:$("mtype").value})});closeM();render()}catch(e){toast(e.message)}}function openEditRole(id,name){action="editrole";$("mt").textContent="Sửa role";$("mf").innerHTML=`<input id="mi" value="${esc(name)}">`;modal.dataset.id=id;$("modal").classList.add("show")}async function delRole(id){if(confirm("Xóa role?")){try{await api(`/api/guilds/${gid}/roles/${id}`,{method:"DELETE"});render()}catch(e){toast(e.message)}}}async function delChannel(id){if(confirm("Xóa kênh?")){try{await api(`/api/guilds/${gid}/channels/${id}`,{method:"DELETE"});render()}catch(e){toast(e.message)}}}
async function mod(id,type){let reason=prompt(type==="ban"?"Lý do ban":"Lý do");try{if(type==="kick")await api(`/api/guilds/${gid}/members/${id}/kick`,{method:"POST",body:JSON.stringify({reason})});if(type==="ban")await api(`/api/guilds/${gid}/members/${id}/ban`,{method:"POST",body:JSON.stringify({reason})});if(type==="timeout")await api(`/api/guilds/${gid}/members/${id}/timeout`,{method:"POST",body:JSON.stringify({reason,ms:3600000})});toast("Đã thực hiện");render()}catch(e){toast(e.message)}}
async function sendMsg(){try{await api(`/api/guilds/${gid}/message`,{method:"POST",body:JSON.stringify({channelId:$("embedChannel").value,content:$("embedText").value})});toast("Đã gửi")}catch(e){toast(e.message)}}function toast(s){let t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");page=b.dataset.p;render()});init();
</script>
<script>
async function loadAntiLink(){
  if(!currentGuild)return;
  const x=await api("/api/guilds/"+currentGuild+"/antilink");
  const e=document.getElementById("alEnabled"), d=document.getElementById("alDomains"), s=document.getElementById("alStatus");
  if(e)e.checked=!!x.enabled;
  if(d)d.value=(x.allowedDomains||[]).join("\n");
  if(s)s.textContent=x.enabled?"Anti Link đang bật.":"Anti Link đang tắt.";
}
async function saveAntiLink(){
  if(!currentGuild)return;
  const allowedDomains=document.getElementById("alDomains").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
  await api("/api/guilds/"+currentGuild+"/antilink",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:document.getElementById("alEnabled").checked,allowedDomains})});
  document.getElementById("alStatus").textContent="✅ Đã lưu.";
}
async function loadTokenStatus(){
  const el=document.getElementById("tokenStatus"); if(!el)return;
  try{const x=await api("/api/token/status");el.textContent=x.connected?"✅ Bot Token đã được lưu an toàn trên server.":"⚠️ Chưa có Bot Token.";}catch{}
}
</script>
</body></html>
