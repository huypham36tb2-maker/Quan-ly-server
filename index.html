<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Discord Server Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#0f1117;color:#f5f7fb}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#171a23;border-right:1px solid #282c38;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}
.logo{font-size:21px;font-weight:800;margin-bottom:25px}
.server{background:#202532;padding:12px;border-radius:10px;margin-bottom:20px}
.nav button{width:100%;border:0;background:transparent;color:#aeb5c5;text-align:left;padding:11px 12px;border-radius:8px;margin:2px 0}
.nav button:hover,.nav button.active{background:#5865f2;color:white}
.main{margin-left:250px;width:calc(100% - 250px);padding:25px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1,h2,h3{margin-top:0}
.muted{color:#8f98aa}
.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#171a23;border:1px solid #282c38;border-radius:12px;padding:18px;margin-bottom:16px}
.stat b{display:block;font-size:27px;margin-top:7px}
.btn{border:0;border-radius:8px;padding:9px 13px;background:#292e3b;color:#fff}
.btn.primary{background:#5865f2}
.btn.danger{background:#ed4245}
.btn.success{background:#23a559}
input,textarea,select{background:#10131a;color:#fff;border:1px solid #303544;border-radius:8px;padding:10px;width:100%}
label{display:block;margin:13px 0 7px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px;border-bottom:1px solid #282c38}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#292e3b;font-size:12px}
.page{display:none}
.page.active{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.switch-row{display:flex;align-items:center;justify-content:space-between;background:#202532;padding:14px;border-radius:10px}
.switch-row input{width:auto}
.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{width:min(500px,100%);background:#171a23;border:1px solid #303544;border-radius:13px;padding:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#202532;padding:13px 17px;border-radius:9px;display:none;z-index:100}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:min(430px,100%);background:#171a23;border:1px solid #282c38;border-radius:15px;padding:30px;text-align:center}
@media(max-width:900px){
.sidebar{width:70px;padding:12px}
.logo{font-size:0}
.logo:after{content:"DS";font-size:18px}
.nav button span,.server{display:none}
.main{margin-left:70px;width:calc(100% - 70px)}
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.main{padding:15px}
.grid{grid-template-columns:1fr}
.head{align-items:flex-start;gap:10px;flex-direction:column}
table{font-size:13px}
}
</style>
</head>

<body>

<div id="login" class="login" style="display:none">
  <div class="login-box">
    <h1>Discord Server Manager</h1>
    <p class="muted">Đăng nhập bằng Discord để quản lý server.</p>
    <a href="/auth/discord">
      <button class="btn primary" style="margin-top:15px;width:100%">
        Đăng nhập Discord
      </button>
    </a>
  </div>
</div>

<div id="app" class="app" style="display:none">

<aside class="sidebar">
  <div class="logo">Discord Manager</div>

  <div class="server">
    <select id="guildSelect" onchange="selectGuild(this.value)">
      <option value="">Chọn server...</option>
    </select>
  </div>

  <nav class="nav">
    <button data-p="overview">📊 <span>Tổng quan</span></button>
    <button data-p="members">👥 <span>Thành viên</span></button>
    <button data-p="roles">🛡️ <span>Roles</span></button>
    <button data-p="channels">💬 <span>Kênh</span></button>
    <button data-p="moderation">🔨 <span>Moderation</span></button>
    <button data-p="automod">⚡ <span>AutoMod</span></button>
    <button data-p="antilink">🔗 <span>Anti Link</span></button>
    <button data-p="welcome">👋 <span>Welcome</span></button>
    <button data-p="embeds">📝 <span>Embed Builder</span></button>
    <button data-p="logs">📜 <span>Logs</span></button>
    <button data-p="permissions">🔐 <span>Permissions</span></button>
    <button data-p="settings">⚙️ <span>Cài đặt</span></button>
  </nav>
</aside>

<main class="main">
  <section id="content"></section>
</main>

</div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let page="overview";
let gid="";
let guilds=[];

const $=id=>document.getElementById(id);

async function api(url,opt={}){
  const r=await fetch(url,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(opt.headers||{})
    },
    ...opt
  });

  if(r.status===401){
    showLogin();
    throw new Error("Chưa đăng nhập");
  }

  const data=await r.json().catch(()=>({}));

  if(!r.ok)
    throw new Error(data.error||"Request failed");

  return data;
}

function toast(text){
  $("toast").textContent=text;
  $("toast").style.display="block";
  setTimeout(()=>$("toast").style.display="none",2500);
}

function showLogin(){
  $("login").style.display="flex";
  $("app").style.display="none";
}

function showApp(){
  $("login").style.display="none";
  $("app").style.display="flex";
}

async function init(){
  try{
    const me=await api("/api/me").catch(()=>null);

    if(!me){
      showLogin();
      return;
    }

    showApp();
    await loadGuilds();
    await render();

  }catch(e){
    showLogin();
  }
}

async function loadGuilds(){
  guilds=await api("/api/guilds");

  const s=$("guildSelect");

  s.innerHTML=
    '<option value="">Chọn server...</option>'+
    guilds.map(g=>
      `<option value="${g.id}">${escapeHtml(g.name)}</option>`
    ).join("");

  const saved=localStorage.getItem("selectedGuild");

  if(saved && guilds.some(x=>x.id===saved)){
    s.value=saved;
    gid=saved;
  }
}

function selectGuild(id){
  gid=id;
  localStorage.setItem("selectedGuild",id);
  render();
}

function escapeHtml(s){
  return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
    page=btn.dataset.p;

    document.querySelectorAll(".nav button")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    render();
  };
});

async function render(){

  if(!gid){
    $("content").innerHTML=`
      <div class="card">
        <h1>Discord Server Manager</h1>
        <p class="muted">
          Hãy chọn một server ở menu bên trái.
        </p>
      </div>
    `;
    return;
  }

  if(page==="overview"){
    await overview();
    return;
  }

  if(page==="members"){
    await members();
    return;
  }

  if(page==="roles"){
    await roles();
    return;
  }

  if(page==="channels"){
    await channels();
    return;
  }

  if(page==="logs"){
    await logs();
    return;
  }

  if(page==="settings"){
    settings();
    loadTokenStatus();
    return;
  }

  if(page==="antilink"){
    antiLinkPage();
    return;
  }

  localPage();
}

async function overview(){

  $("content").innerHTML=`<div class="head">
    <div>
      <h1>Tổng quan</h1>
      <p class="muted">Thông tin server</p>
    </div>
    <button class="btn primary" onclick="overview()">↻ Làm mới</button>
  </div>
  <div id="overviewData"></div>`;

  try{

    const x=await api("/api/guilds/"+gid+"/overview");

    $("overviewData").innerHTML=`
      <div class="grid">

        <div class="card stat">
          Thành viên
          <b>${x.memberCount??x.members??0}</b>
        </div>

        <div class="card stat">
          Channels
          <b>${x.channelCount??x.channels??0}</b>
        </div>

        <div class="card stat">
          Roles
          <b>${x.roleCount??x.roles??0}</b>
        </div>

        <div class="card stat">
          Server ID
          <b style="font-size:15px">${gid}</b>
        </div>

      </div>
    `;

  }catch(e){

    $("overviewData").innerHTML=
      `<div class="card">❌ ${escapeHtml(e.message)}</div>`;

  }
}

async function members(){

  $("content").innerHTML=`
    <div class="head">
      <div>
        <h1>Thành viên</h1>
        <p class="muted">Quản lý thành viên server</p>
      </div>
    </div>
    <div class="card" id="memberData">Đang tải...</div>
  `;

  try{

    const x=await api("/api/guilds/"+gid+"/members");

    const list=x.members||x;

    $("memberData").innerHTML=`
      <table>
        <thead>
          <tr>
            <th>Thành viên</th>
            <th>ID</th>
            <th>Bot</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody>

        ${list.map(m=>`
          <tr>
            <td>${escapeHtml(m.user?.username||m.username||"Unknown")}</td>
            <td>${escapeHtml(m.user?.id||m.id||"")}</td>
            <td>${m.user?.bot||m.bot?"Bot":"User"}</td>
            <td>
              <div class="actions">

                <button class="btn danger"
                  onclick="memberAction('${m.user?.id||m.id}','kick')">
                  Kick
                </button>

                <button class="btn danger"
                  onclick="memberAction('${m.user?.id||m.id}','ban')">
                  Ban
                </button>

                <button class="btn"
                  onclick="memberAction('${m.user?.id||m.id}','timeout')">
                  Timeout
                </button>

              </div>
            </td>
          </tr>
        `).join("")}

        </tbody>
      </table>
    `;

  }catch(e){

    $("memberData").innerHTML=
      `<p>❌ ${escapeHtml(e.message)}</p>`;

  }
}

async function memberAction(id,action){

  if(!confirm("Bạn chắc chắn muốn thực hiện hành động này?"))
    return;

  try{

    await api(
      "/api/guilds/"+gid+"/members/"+id+"/"+action,
      {method:"POST",body:JSON.stringify({})}
    );

    toast("Đã thực hiện "+action);
    members();

  }catch(e){
    toast(e.message);
  }
}

async function roles(){

  $("content").innerHTML=`
    <div class="head">
      <div>
        <h1>Roles</h1>
        <p class="muted">Quản lý role</p>
      </div>

      <button class="btn primary"
        onclick="openRoleModal()">
        + Tạo Role
      </button>
    </div>

    <div class="card" id="roleData">Đang tải...</div>
  `;

  try{

    const x=await api("/api/guilds/"+gid+"/roles");
    const list=x.roles||x;

    $("roleData").innerHTML=list.map(r=>`
      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px;
        border-bottom:1px solid #282c38">

        <div>
          <b>${escapeHtml(r.name)}</b>
          <div class="muted small">${r.id}</div>
        </div>

        <div class="actions">

          <button class="btn"
            onclick="editRole('${r.id}','${escapeHtml(r.name)}')">
            Sửa
          </button>

          <button class="btn danger"
            onclick="deleteRole('${r.id}')">
            Xóa
          </button>

        </div>
      </div>
    `).join("");

  }catch(e){

    $("roleData").innerHTML=
      `<p>❌ ${escapeHtml(e.message)}</p>`;

  }
}

function openRoleModal(){

  openModal(`
    <h2>Tạo Role</h2>

    <label>Tên Role</label>
    <input id="roleName" placeholder="VIP">

    <div class="actions" style="margin-top:15px">
      <button class="btn primary" onclick="createRole()">
        Tạo
      </button>

      <button class="btn" onclick="closeModal()">
        Hủy
      </button>
    </div>
  `);
}

async function createRole(){

  const name=$("roleName").value.trim();

  if(!name)return;

  try{

    await api("/api/guilds/"+gid+"/roles",{
      method:"POST",
      body:JSON.stringify({name})
    });

    closeModal();
    toast("Đã tạo role");
    roles();

  }catch(e){
    toast(e.message);
  }
}

async function deleteRole(id){

  if(!confirm("Xóa role này?"))return;

  try{

    await api("/api/guilds/"+gid+"/roles/"+id,{
      method:"DELETE"
    });

    toast("Đã xóa role");
    roles();

  }catch(e){
    toast(e.message);
  }
}

function editRole(id,name){

  openModal(`
    <h2>Sửa Role</h2>

    <label>Tên Role</label>
    <input id="roleName" value="${escapeHtml(name)}">

    <div class="actions" style="margin-top:15px">
      <button class="btn primary"
        onclick="updateRole('${id}')">
        Lưu
      </button>

      <button class="btn" onclick="closeModal()">
        Hủy
      </button>
    </div>
  `);
}

async function updateRole(id){

  const name=$("roleName").value.trim();

  try{

    await api("/api/guilds/"+gid+"/roles/"+id,{
      method:"PATCH",
      body:JSON.stringify({name})
    });

    closeModal();
    roles();

  }catch(e){
    toast(e.message);
  }
}

async function channels(){

  $("content").innerHTML=`
    <div class="head">
      <div>
        <h1>Kênh</h1>
        <p class="muted">Quản lý channels</p>
      </div>

      <button class="btn primary"
        onclick="openChannelModal()">
        + Tạo kênh
      </button>
    </div>

    <div class="card" id="channelData">
      Đang tải...
    </div>
  `;

  try{

    const x=await api("/api/guilds/"+gid+"/channels");
    const list=x.channels||x;

    $("channelData").innerHTML=list.map(c=>`
      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px;
        border-bottom:1px solid #282c38">

        <div>
          <b>${c.type===2?"🔊":"#"} ${escapeHtml(c.name)}</b>
          <div class="muted small">${c.id}</div>
        </div>

        <button class="btn danger"
          onclick="deleteChannel('${c.id}')">
          Xóa
        </button>

      </div>
    `).join("");

  }catch(e){

    $("channelData").innerHTML=
      `<p>❌ ${escapeHtml(e.message)}</p>`;

  }
}

function openChannelModal(){

  openModal(`
    <h2>Tạo kênh</h2>

    <label>Tên</label>
    <input id="channelName" placeholder="general">

    <label>Loại</label>
    <select id="channelType">
      <option value="0">Text</option>
      <option value="2">Voice</option>
    </select>

    <div class="actions" style="margin-top:15px">
      <button class="btn primary"
        onclick="createChannel()">
        Tạo
      </button>

      <button class="btn"
        onclick="closeModal()">
        Hủy
      </button>
    </div>
  `);
}

async function createChannel(){

  const name=$("channelName").value.trim();
  const type=Number($("channelType").value);

  try{

    await api("/api/guilds/"+gid+"/channels",{
      method:"POST",
      body:JSON.stringify({name,type})
    });

    closeModal();
    toast("Đã tạo kênh");
    channels();

  }catch(e){
    toast(e.message);
  }
}

async function deleteChannel(id){

  if(!confirm("Xóa kênh này?"))return;

  try{

    await api("/api/guilds/"+gid+"/channels/"+id,{
      method:"DELETE"
    });

    toast("Đã xóa kênh");
    channels();

  }catch(e){
    toast(e.message);
  }
}

async function logs(){

  $("content").innerHTML=`
    <div class="head">
      <h1>Logs</h1>
    </div>

    <div class="card" id="logData">
      Đang tải...
    </div>
  `;

  try{

    const x=await api("/api/guilds/"+gid+"/logs");
    const list=x.logs||x;

    $("logData").innerHTML=`
      <table>
        <thead>
          <tr>
            <th>Action</th>
            <th>User</th>
            <th>Target</th>
            <th>Thời gian</th>
          </tr>
        </thead>

        <tbody>
        ${list.map(l=>`
          <tr>
            <td>${escapeHtml(l.action||l.type||"")}</td>
            <td>${escapeHtml(l.executor?.username||l.user||"")}</td>
            <td>${escapeHtml(l.target||"")}</td>
            <td>${escapeHtml(l.createdAt||"")}</td>
          </tr>
        `).join("")}
        </tbody>
      </table>
    `;

  }catch(e){

    $("logData").innerHTML=
      `<p>❌ ${escapeHtml(e.message)}</p>`;

  }
}

function antiLinkPage(){

  $("content").innerHTML=`

    <div class="head">
      <div>
        <h1>🔗 Anti Link</h1>
        <p class="muted">
          Tự động xóa link không được phép.
        </p>
      </div>
    </div>

    <div class="card">

      <label class="switch-row">

        <span>
          <b>Bật Anti Link</b>
          <br>
          <small class="muted">
            Bot sẽ xóa link ngoài whitelist.
          </small>
        </span>

        <input
          id="alEnabled"
          type="checkbox"
          style="width:auto">

      </label>

      <label>
        Domain được phép
      </label>

      <textarea
        id="alDomains"
        rows="8"
        placeholder="youtube.com
discord.com
tiktok.com"></textarea>

      <div class="actions" style="margin-top:15px">

        <button
          class="btn primary"
          onclick="saveAntiLink()">
          💾 Lưu cấu hình
        </button>

      </div>

      <p id="alStatus" class="muted small"></p>

    </div>
  `;

  loadAntiLink();
}

async function loadAntiLink(){

  try{

    const x=await api(
      "/api/guilds/"+gid+"/antilink"
    );

    $("alEnabled").checked=!!x.enabled;

    $("alDomains").value=
      (x.allowedDomains||[]).join("\n");

    $("alStatus").textContent=
      x.enabled
      ?"Anti Link đang bật."
      :"Anti Link đang tắt.";

  }catch(e){

    $("alStatus").textContent=
      "❌ "+e.message;

  }
}

async function saveAntiLink(){

  try{

    const domains=
      $("alDomains")
      .value
      .split(/[\n,]+/)
      .map(x=>x.trim())
      .filter(Boolean);

    await api(
      "/api/guilds/"+gid+"/antilink",
      {
        method:"POST",
        body:JSON.stringify({
          enabled:$("alEnabled").checked,
          allowedDomains:domains
        })
      }
    );

    $("alStatus").textContent=
      "✅ Đã lưu Anti Link.";

    toast("Đã lưu Anti Link");

  }catch(e){

    toast(e.message);

  }
}

function localPage(){

  const titles={
    moderation:["🔨 Moderation","Các công cụ quản lý server"],
    automod:["⚡ AutoMod","Thiết lập AutoMod"],
    welcome:["👋 Welcome","Tin nhắn chào mừng thành viên"],
    embeds:["📝 Embed Builder","Tạo Embed"],
    permissions:["🔐 Permission Manager","Quản lý quyền"]
  };

  const t=titles[page]||["Dashboard",""];

  $("content").innerHTML=`

    <div class="head">
      <div>
        <h1>${t[0]}</h1>
        <p class="muted">${t[1]}</p>
      </div>
    </div>

    <div class="card">

      <h2>${t[0]}</h2>

      <p class="muted">
        Module này được tích hợp trong dashboard.
      </p>

      ${
        page==="moderation"
        ?`
        <div class="actions">

          <button class="btn danger"
            onclick="promptModeration('purge')">
            🗑️ Xóa tin nhắn
          </button>

          <button class="btn"
            onclick="promptModeration('lock')">
            🔒 Lock kênh
          </button>

          <button class="btn"
            onclick="promptModeration('unlock')">
            🔓 Unlock kênh
          </button>

        </div>`
        :
        page==="welcome"
        ?`
        <label>Channel ID</label>
        <input id="welcomeChannel">

        <label>Welcome Message</label>
        <textarea id="welcomeMessage"
          rows="5"
          placeholder="Chào mừng {user} đến với server!"></textarea>

        <button class="btn primary"
          style="margin-top:12px"
          onclick="toast('Đã lưu Welcome')">
          💾 Lưu
        </button>
        `
        :
        page==="embeds"
        ?`
        <label>Tiêu đề</label>
        <input id="embedTitle">

        <label>Nội dung</label>
        <textarea id="embedDescription"
          rows="6"></textarea>

        <label>Channel ID</label>
        <input id="embedChannel">

        <button class="btn primary"
          style="margin-top:12px"
          onclick="toast('Embed đã được tạo')">
          Gửi Embed
        </button>
        `
        :
        `<p>
          ⚙️ Bạn có thể cấu hình module này tại đây.
        </p>`
      }

    </div>
  `;
}

function promptModeration(type){

  const channel=prompt("Nhập Channel ID:");

  if(!channel)return;

  api("/api/guilds/"+gid+"/moderation",{
    method:"POST",
    body:JSON.stringify({
      action:type,
      channelId:channel
    })
  })
  .then(()=>toast("Đã thực hiện"))
  .catch(e=>toast(e.message));
}

function settings(){

  $("content").innerHTML=`

    <div class="head">
      <div>
        <h1>⚙️ Cài đặt</h1>
        <p class="muted">
          Cấu hình Bot và dashboard.
        </p>
      </div>
    </div>

    <div class="card">

      <h2>🤖 Bot Token</h2>

      <p class="muted small">
        Token được gửi tới backend và mã hóa AES-256-GCM.
        Không lưu token trong trình duyệt.
      </p>

      <p id="tokenStatus" class="muted small"></p>

      <input
        id="token"
        type="password"
        placeholder="Nhập Bot Token">

      <div class="actions" style="margin-top:12px">

        <button class="btn primary"
          onclick="saveToken()">
          🔐 Lưu & kết nối Bot
        </button>

        <button class="btn danger"
          onclick="deleteToken()">
          Xóa Token
        </button>

      </div>

    </div>
  `;

  loadTokenStatus();
}

async function loadTokenStatus(){

  const el=$("tokenStatus");

  if(!el)return;

  try{

    const x=await api("/api/token/status");

    el.textContent=
      x.connected
      ?"✅ Bot Token đã được lưu an toàn trên server."
      :"⚠️ Chưa có Bot Token.";

  }catch{}

}

async function saveToken(){

  const token=$("token").value.trim();

  if(!token){
    toast("Chưa nhập Bot Token");
    return;
  }

  try{

    await api("/api/token",{
      method:"POST",
      body:JSON.stringify({token})
    });

    $("token").value="";

    toast("Đã lưu Bot Token");

    loadTokenStatus();

  }catch(e){

    toast(e.message);

  }
}

async function deleteToken(){

  if(!confirm("Xóa Bot Token đã lưu?"))
    return;

  try{

    await api("/api/token/delete",{
      method:"POST"
    });

    toast("Đã xóa Token");

    loadTokenStatus();

  }catch(e){

    toast(e.message);

  }
}

function openModal(content){

  $("modalContent").innerHTML=content;
  $("modalBg").style.display="flex";

}

function closeModal(){

  $("modalBg").style.display="none";

}

$("modalBg").addEventListener("click",e=>{
  if(e.target===$("modalBg"))
    closeModal();
});

init();
</script>

</body>
</html>
